name: Node.js Package NPMJS

# Publishing a release is what ships a version. The release notes are written by
# Release Drafter (.github/release-drafter.yml); this workflow only builds,
# tests and publishes, and never rewrites the release body.
on:
  release:
    types:
      - published
  # Re-run a publish by hand after fixing a token or a failed run, without
  # having to recreate the release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the runner mint an OIDC token for npm trusted publishing. With a
      # trusted publisher configured on the package, npm verifies that token
      # and no secret is involved at all — which also sidesteps the 2FA prompt
      # that blocks token publishes from CI.
      id-token: write
    steps:
      # Check out the tag the release points at, not the branch head, so the
      # published artifact is exactly what was released.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Resolve and verify the version
        id: version
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

          # The release tag is the source of truth for the version. A mismatch
          # means package.json was not bumped, which would publish the wrong
          # version — fail loudly rather than ship it.
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_VERSION="${{ github.event.release.tag_name }}"
            TAG_VERSION="${TAG_VERSION#v}"
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::package.json is $PKG_VERSION but the release tag is $TAG_VERSION. Bump package.json and re-run."
              exit 1
            fi
          fi

          # Republishing an existing version is refused by the registry, so a
          # re-run of an already-shipped version should be a no-op, not a
          # failure.
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$PKG_NAME@$PKG_VERSION is already on npm — nothing to publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Publishing $PKG_NAME@$PKG_VERSION"
          fi

      # npm prefers OIDC when a trusted publisher is configured and falls back
      # to NODE_AUTH_TOKEN otherwise, so both routes work from this one step.
      # The token route needs a token that does NOT prompt for 2FA: a Classic
      # "Automation" token, or a Granular Access Token with 2FA bypass. A
      # Classic "Publish" token asks for a one-time password and fails in CI
      # with EOTP.
      - name: Publish to npm
        if: steps.version.outputs.already_published == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Explain a 2FA failure
        if: failure()
        run: |
          echo "::notice::If this failed with EOTP, the npm token requires a one-time password. CI cannot supply one. Either swap it for a Classic 'Automation' token, or configure trusted publishing for this package on npmjs.com (Settings > Trusted Publisher: repo NekoSuneProjects/vector-sdk-js, workflow npm-publish.yml) and no token is needed at all."
