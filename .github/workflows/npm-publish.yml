name: Node.js Package NPMJS

# Publishing the Release Drafter draft is what ships a version. The release
# notes are written by Release Drafter (.github/release-drafter.yml); this
# workflow only builds, tests and publishes, and never rewrites the release
# body.
on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Check out the tag the release points at, not the branch head, so the
      # published artifact is exactly what was released.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # The release tag is the source of truth for the version. A mismatch
      # means package.json was not bumped, which would publish the wrong
      # version — fail loudly rather than ship it.
      - name: Verify package.json matches the release tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json is $PKG_VERSION but the release tag is $TAG_VERSION. Bump package.json and re-run."
            exit 1
          fi
          echo "Publishing $PKG_VERSION"

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
